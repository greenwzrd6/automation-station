services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: kanban-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: kanban
      RABBITMQ_DEFAULT_PASS: kanban-dev

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data: